<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>流程</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
background:linear-gradient(180deg,#1a1f2e,#0a0e1a 60%);color:#e8e2d0;
min-height:100vh;padding:0 0 30px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* 当前阶段大卡 */
.stage{position:sticky;top:0;z-index:20;background:rgba(10,14,26,.97);
backdrop-filter:blur(12px);border-bottom:1px solid rgba(212,175,55,.2);
padding:16px 16px 14px}
.stage .step{font-size:11px;color:#7a7565;letter-spacing:3px}
.stage .t{font-size:23px;font-weight:700;color:#d4af37;margin:5px 0 2px}
.stage .clk{font-size:40px;font-weight:700;font-family:ui-monospace,Menlo,monospace;
letter-spacing:2px;margin:6px 0 2px}
.stage .clk.over{color:#e74c3c}
.stage .row{display:flex;gap:8px;margin-top:10px}
.stage button{flex:1;padding:12px;border-radius:9px;border:none;font-family:inherit;
font-size:15px;font-weight:600;cursor:pointer}
.stage .next{background:linear-gradient(180deg,#d4af37,#b8932b);color:#1a1f2e}
.stage .pause{background:transparent;border:1px solid rgba(212,175,55,.35);
color:#b09a5c;flex:0 0 90px}
.stage button:active{transform:scale(.98)}

.code{background:rgba(212,175,55,.14);border:1px solid rgba(212,175,55,.5);
border-radius:12px;padding:14px;margin:14px 0;text-align:center}
.code .lb{font-size:11px;color:#b09a5c;letter-spacing:3px}
.code .vl{font-size:50px;font-weight:700;color:#d4af37;letter-spacing:14px;
font-family:ui-monospace,Menlo,monospace;margin-top:4px;padding-left:14px}
.code .hint{font-size:12px;color:#9a8850;margin-top:6px}

.desc{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
border-radius:12px;padding:16px;margin-bottom:14px;font-size:15px;
line-height:1.85;color:#c9c3b1;white-space:pre-wrap}
.desc b{color:#f0d98a}

.tip{background:rgba(90,130,180,.1);border:1px solid rgba(120,160,210,.3);
border-radius:10px;padding:13px 15px;font-size:13px;line-height:1.75;
color:#a9bdd4;margin-bottom:14px;white-space:pre-wrap}
.tip .tg{display:inline-block;font-size:10px;letter-spacing:2px;color:#8fb4e0;
border:1px solid rgba(143,180,224,.45);border-radius:4px;padding:2px 6px;margin-bottom:7px}

h2{font-size:14px;color:#8a8474;margin:22px 0 10px;letter-spacing:1px}
.list{border:1px solid rgba(255,255,255,.07);border-radius:11px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;
border-bottom:1px solid rgba(255,255,255,.05);font-size:14px;cursor:pointer}
.li:last-child{border-bottom:none}
.li .n{font-size:11px;color:#5a5545;font-family:ui-monospace,monospace;width:18px}
.li .nm{flex:1;color:#7a7565}
.li .m{font-size:11px;color:#5a5545}
.li.done{background:rgba(255,255,255,.02)}
.li.done .nm{color:#9a9484}
.li.done .n::after{content:'✓';color:#4caf50;margin-left:2px}
.li.cur{background:rgba(212,175,55,.12)}
.li.cur .nm{color:#d4af37;font-weight:600}
.li .cd{font-size:12px;font-family:ui-monospace,monospace;color:#b09a5c;
background:rgba(212,175,55,.15);border-radius:5px;padding:2px 7px}

.rules{background:rgba(192,57,43,.1);border:1px solid rgba(192,57,43,.32);
border-radius:12px;padding:15px;font-size:13.5px;line-height:1.9;color:#dba79f;margin-top:16px}
.rules b{color:#ff9a8d}
.rules div{margin-bottom:5px}

.empty{text-align:center;padding:90px 20px;color:#7a7565;font-size:15px;
line-height:1.9;white-space:pre-wrap}
.empty .big{font-size:44px;margin-bottom:16px}
</style></head><body>
<div id="app"><div class="empty"><div class="big">⏱️</div>正在载入流程…</div></div>

<script>
// 这一页没有任何剧透：没有凶手、没有时间线、没有玩家链接。
// 放在桌子中间，谁都可以点「进入下一阶段」。
let D = null, cur = -1, endAt = 0, tk = null, leftover = 0;
const SK = 'jbs_flow_state';

function b64u(s){
  const pad = s.length % 4 ? '='.repeat(4 - s.length % 4) : '';
  const bin = atob(s.replace(/-/g,'+').replace(/_/g,'/') + pad);
  return Uint8Array.from(bin, c => c.charCodeAt(0));
}
async function gunzip(b){
  return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
async function decrypt(blob, k){
  const key = await crypto.subtle.importKey('raw', k, 'AES-GCM', false, ['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt(
    {name:'AES-GCM', iv: blob.slice(0,12)}, key, blob.slice(12)));
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }

async function boot(){
  const h = decodeURIComponent(location.hash.replace(/^#/,''));
  if(!h) return fail('没有流程数据','请用群里那个流程链接打开本页。');
  try{
    const dot = h.lastIndexOf('.');
    const res = await fetch('d/'+h.slice(0,dot)+'.txt',{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    D = JSON.parse(await gunzip(await decrypt(b64u((await res.text()).trim()), b64u(h.slice(dot+1)))));
  }catch(e){
    return fail('打不开流程页','链接可能不完整。把完整链接复制到浏览器地址栏再试。\n\n（'+e.message+'）');
  }
  try{
    const st = JSON.parse(localStorage.getItem(SK) || 'null');
    if(st && st.cur >= 0){ cur = st.cur; endAt = st.endAt; }
  }catch(e){}
  render();
  if(cur >= 0){ tk = setInterval(tick, 250); tick(); }
}
function fail(t,d){
  document.getElementById('app').innerHTML =
    '<div class="empty"><div class="big">⏱️</div><div style="color:#d4af37;font-size:19px;margin-bottom:12px">'+
    esc(t)+'</div>'+esc(d)+'</div>';
}
function save(){ localStorage.setItem(SK, JSON.stringify({cur, endAt})); }

function render(){
  const P = D.phases;
  let h = '';

  if(cur < 0){
    h += '<div class="stage"><div class="step">还没开始</div>' +
         '<div class="t">'+esc(D.title)+'</div>' +
         '<div class="clk">--:--</div>' +
         '<div class="row"><button class="next" onclick="go(0)">开始第 1 步</button></div></div>';
    h += '<div class="wrap">';
    h += '<div class="desc">'+fmt(D.intro)+'</div>';
  }else{
    const p = P[cur];
    h += '<div class="stage">' +
         '<div class="step">第 '+(cur+1)+' / '+P.length+' 步</div>' +
         '<div class="t">'+esc(p[0])+'</div>' +
         '<div class="clk" id="clk">--:--</div>' +
         '<div class="row">' +
         '<button class="pause" onclick="tgl()" id="pz">暂停</button>' +
         '<button class="next" onclick="go('+(cur+1)+')">' +
         (cur+1 < P.length ? '进入下一步 →' : '结束') + '</button></div></div>';
    h += '<div class="wrap">';
    if(p[2]){
      h += '<div class="code"><div class="lb">现在解锁</div><div class="vl">'+esc(p[2])+'</div>' +
           '<div class="hint">六个人都在自己的角色本里输入这个码</div></div>';
    }
    h += '<div class="desc">'+fmt(p[3])+'</div>';
    if(p[4]) h += '<div class="tip"><div class="tg">卡住了就试试</div>'+fmt(p[4])+'</div>';
  }

  h += '<h2>全部流程（共 '+P.length+' 步 · 约 '+D.total+' 分钟）</h2><div class="list">';
  P.forEach((p, i) => {
    const cls = i === cur ? 'cur' : (i < cur ? 'done' : '');
    h += '<div class="li '+cls+'" onclick="jump('+i+')">' +
         '<span class="n">'+(i+1)+'</span><span class="nm">'+esc(p[0])+'</span>' +
         (p[2] && i <= cur ? '<span class="cd">'+esc(p[2])+'</span>' : '') +
         '<span class="m">'+p[1]+'′</span></div>';
  });
  h += '</div>';

  h += '<div class="rules">'+fmt(D.rules)+'</div>';
  h += '<div style="text-align:center;margin-top:18px">' +
       '<button onclick="reset()" style="background:transparent;border:1px solid rgba(255,255,255,.15);' +
       'color:#5a5545;border-radius:8px;padding:8px 16px;font-size:12px;font-family:inherit;cursor:pointer">' +
       '重开一局（清空进度）</button></div>';
  h += '</div>';

  document.getElementById('app').innerHTML = h;
}

function go(i){
  if(i >= D.phases.length){
    if(!confirm('已经是最后一步了。结束这一局？')) return;
    return reset();
  }
  if(i > cur + 1 && !confirm('要跳过中间的步骤吗？跳过会让别人提前拿到解锁码。')) return;
  cur = i; endAt = Date.now() + D.phases[i][1]*60000; leftover = 0;
  save(); render();
  if(tk) clearInterval(tk);
  tk = setInterval(tick, 250); tick();
  window.scrollTo({top:0, behavior:'smooth'});
}
function jump(i){
  if(i === cur) return;
  if(i > cur){ go(i); return; }
  if(confirm('回到第 '+(i+1)+' 步「'+D.phases[i][0]+'」？')) go(i);
}
function tick(){
  const el = document.getElementById('clk');
  if(!el) return;
  const ms = endAt - Date.now(), a = Math.abs(ms);
  el.textContent = (ms<0?'+':'') +
    String(Math.floor(a/60000)).padStart(2,'0') + ':' +
    String(Math.floor(a%60000/1000)).padStart(2,'0');
  el.classList.toggle('over', ms < 0);
}
function tgl(){
  const b = document.getElementById('pz');
  if(tk){ clearInterval(tk); tk = null; leftover = endAt - Date.now(); b.textContent = '继续'; }
  else { endAt = Date.now() + leftover; save(); tk = setInterval(tick,250); b.textContent = '暂停'; }
}
function reset(){
  if(!confirm('清空进度，从头开始？')) return;
  localStorage.removeItem(SK);
  if(tk) clearInterval(tk);
  tk = null; cur = -1; render();
}
boot();
</script>
</body></html>

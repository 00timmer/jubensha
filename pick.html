<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>选角色</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
background:linear-gradient(180deg,#1a1f2e,#0a0e1a 60%);color:#e8e2d0;
min-height:100vh;padding:0 0 40px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.hero{text-align:center;padding:26px 0 8px}
.hero .s{font-size:11px;color:#7a7565;letter-spacing:4px}
.hero h1{font-size:26px;color:#d4af37;letter-spacing:5px;font-weight:700;margin-top:8px}
.hero .p{font-size:13px;color:#8a8474;margin-top:8px}

.note{background:rgba(212,175,55,.07);border:1px dashed rgba(212,175,55,.3);
border-radius:10px;padding:13px 15px;font-size:13px;line-height:1.8;
color:#b09a5c;margin:16px 0;white-space:pre-wrap}
.note b{color:#e0c86a}

.card{background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.22);
border-radius:14px;padding:15px;margin-bottom:11px;display:flex;
align-items:center;gap:13px;cursor:pointer;transition:all .15s}
.card:active{transform:scale(.985)}
.card .av{font-size:34px;flex:0 0 auto}
.card .mid{flex:1;min-width:0}
.card .nm{font-size:18px;font-weight:600;color:#e8e2d0}
.card .mt{font-size:12px;color:#8a8474;margin-top:3px}
.card .ds{font-size:12.5px;color:#7a7565;margin-top:6px;line-height:1.6}
.card .go{font-size:13px;color:#d4af37;border:1px solid rgba(212,175,55,.4);
border-radius:8px;padding:8px 13px;white-space:nowrap}

.card.taken{border-color:rgba(255,255,255,.07);background:rgba(255,255,255,.015);
cursor:default;opacity:.55}
.card.taken .nm,.card.taken .mt,.card.taken .ds{color:#5a5545}
.card.taken .av{filter:grayscale(1);opacity:.5}
.card.taken .go{color:#4caf50;border-color:rgba(76,175,80,.4)}

.long{display:inline-block;font-size:10px;color:#e0a860;border:1px solid rgba(224,168,96,.4);
border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}

.bar{position:sticky;bottom:0;background:rgba(10,14,26,.96);backdrop-filter:blur(10px);
border-top:1px solid rgba(212,175,55,.18);margin:0 -16px;padding:12px 16px
calc(12px + env(safe-area-inset-bottom));text-align:center}
.bar .cnt{font-size:13px;color:#8a8474;margin-bottom:9px}
.bar button{width:100%;padding:14px;border-radius:10px;border:none;
background:linear-gradient(180deg,#d4af37,#b8932b);color:#1a1f2e;
font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
.bar button:disabled{background:rgba(255,255,255,.06);color:#5a5545;cursor:not-allowed}

/* 确认层 */
.ov{position:fixed;inset:0;background:rgba(6,9,16,.96);backdrop-filter:blur(6px);
z-index:99;display:flex;align-items:center;justify-content:center;padding:24px}
.ov .box{max-width:400px;width:100%;text-align:center}
.ov .av{font-size:66px;margin-bottom:10px}
.ov h2{font-size:28px;color:#d4af37;letter-spacing:3px;margin-bottom:6px}
.ov .mt{font-size:13.5px;color:#8a8474;margin-bottom:18px}
.ov .ds{font-size:14px;color:#b8b2a0;line-height:1.9;margin-bottom:22px;
background:rgba(255,255,255,.04);border-radius:12px;padding:16px;text-align:left}
.ov button{width:100%;padding:15px;border-radius:10px;border:none;font-size:16px;
font-weight:600;font-family:inherit;cursor:pointer;margin-bottom:9px}
.ov .yes{background:linear-gradient(180deg,#d4af37,#b8932b);color:#1a1f2e}
.ov .no{background:transparent;border:1px solid rgba(255,255,255,.16);color:#8a8474}

/* 分发页 */
.dist{background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.2);
border-radius:12px;padding:14px;margin-bottom:10px}
.dist .top{display:flex;align-items:center;gap:11px}
.dist .av{font-size:28px}
.dist .who{flex:1;min-width:0}
.dist .who .a{font-size:16px;font-weight:600}
.dist .who .b{font-size:12px;color:#7a7565;margin-top:2px}
.cp{background:linear-gradient(180deg,#d4af37,#b8932b);color:#1a1f2e;border:none;
border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;
font-family:inherit;cursor:pointer;white-space:nowrap}
.cp.ok{background:#4caf50;color:#fff}
.url{margin-top:9px;font-size:10px;color:#5a5545;word-break:break-all;
font-family:ui-monospace,Menlo,monospace;line-height:1.5}
.reset{background:transparent;border:1px solid rgba(255,255,255,.14);color:#5a5545;
border-radius:8px;padding:9px 16px;font-size:12px;font-family:inherit;
cursor:pointer;display:block;margin:20px auto 0}
.empty{text-align:center;padding:90px 20px;color:#7a7565;font-size:15px;
line-height:1.9;white-space:pre-wrap}
.empty .big{font-size:44px;margin-bottom:16px}
</style></head><body>
<div id="app"><div class="empty"><div class="big">🎭</div>正在载入…</div></div>

<script>
// 一台设备传一圈：每人点自己想演的角色，点过的立刻标成「已被选」。
// 状态存在这一台设备上，不需要服务器。
let D = null, picked = {}, sel = null;
const SK = 'jbs_pick';

function b64u(s){
  const pad = s.length % 4 ? '='.repeat(4 - s.length % 4) : '';
  const bin = atob(s.replace(/-/g,'+').replace(/_/g,'/') + pad);
  return Uint8Array.from(bin, c => c.charCodeAt(0));
}
async function gunzip(b){
  return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
async function decrypt(blob, k){
  const key = await crypto.subtle.importKey('raw', k, 'AES-GCM', false, ['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt(
    {name:'AES-GCM', iv: blob.slice(0,12)}, key, blob.slice(12)));
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }

async function boot(){
  const h = decodeURIComponent(location.hash.replace(/^#/,''));
  if(!h) return fail('没有角色数据','请用群里那个选角链接打开本页。');
  try{
    const dot = h.lastIndexOf('.');
    const res = await fetch('d/'+h.slice(0,dot)+'.txt',{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    D = JSON.parse(await gunzip(await decrypt(b64u((await res.text()).trim()), b64u(h.slice(dot+1)))));
  }catch(e){
    return fail('打不开选角页','链接可能不完整。把完整链接复制到浏览器地址栏再试。\n\n（'+e.message+'）');
  }
  try{ picked = JSON.parse(localStorage.getItem(SK) || '{}'); }catch(e){ picked = {}; }
  render();
}
function fail(t,d){
  document.getElementById('app').innerHTML =
    '<div class="empty"><div class="big">🎭</div><div style="color:#d4af37;font-size:19px;margin-bottom:12px">'+
    esc(t)+'</div>'+esc(d)+'</div>';
}
function save(){ localStorage.setItem(SK, JSON.stringify(picked)); }

function render(){
  const n = Object.keys(picked).length, total = D.roles.length;
  let h = '<div class="wrap">';
  h += '<div class="hero"><div class="s">'+esc(D.title)+'</div>' +
       '<h1>选 角 色</h1><div class="p">六个人，一台手机，传一圈</div></div>';

  if(n < total){
    h += '<div class="note">'+fmt(D.tip)+'</div>';
    D.roles.forEach((r, i) => {
      const taken = !!picked[r.name];
      h += '<div class="card'+(taken?' taken':'')+'"'+(taken?'':' onclick="open_('+i+')"')+'>' +
           '<span class="av">'+esc(r.av)+'</span><div class="mid">' +
           '<div class="nm">'+esc(r.name)+
           (r.long?'<span class="long">篇幅较长</span>':'')+'</div>' +
           '<div class="mt">'+esc(r.g)+' · '+esc(r.a)+' 岁 · '+esc(r.j)+'</div>' +
           '<div class="ds">'+esc(r.blurb)+'</div></div>' +
           '<span class="go">'+(taken ? '已被选 ✓' : '我选这个') +'</span></div>';
    });
    h += '<div class="bar"><div class="cnt">已选 '+n+' / '+total+
         (n<total ? ' · 把手机传给下一个人' : '')+'</div>' +
         '<button '+(n<total?'disabled':'')+' onclick="render()">'+
         (n<total ? '还差 '+(total-n)+' 个人' : '全部选完 · 发链接') + '</button></div>';
  }else{
    h += '<div class="note">六个人都选好了。逐个复制链接，'+
         '<b>微信发给对应的人</b>。发完就可以开始了。</div>';
    D.roles.forEach(r => {
      h += '<div class="dist"><div class="top"><span class="av">'+esc(r.av)+'</span>' +
           '<div class="who"><div class="a">'+esc(picked[r.name])+' → '+esc(r.name)+'</div>' +
           '<div class="b">'+esc(r.g)+' · '+esc(r.a)+' 岁 · '+esc(r.j)+'</div></div>' +
           '<button class="cp" onclick="cp(this,\''+r.url+'\')">复制链接</button></div>' +
           '<div class="url">'+esc(r.url)+'</div></div>';
    });
    h += '<div class="note" style="margin-top:18px">发完之后，打开<b>流程页</b>，'+
         '放在桌子中间，六个人一起照着走。</div>';
    if(D.flowUrl){
      h += '<div class="dist"><div class="top"><span class="av">⏱️</span>' +
           '<div class="who"><div class="a">流程页</div>' +
           '<div class="b">共用一台设备打开，无剧透</div></div>' +
           '<button class="cp" onclick="cp(this,\''+D.flowUrl+'\')">复制链接</button></div></div>';
    }
    h += '<button class="reset" onclick="reset()">重新选角</button>';
  }
  h += '</div>';
  document.getElementById('app').innerHTML = h;
}

function open_(i){
  sel = i;
  const r = D.roles[i];
  const ov = document.createElement('div');
  ov.className = 'ov'; ov.id = 'ov';
  ov.innerHTML = '<div class="box"><div class="av">'+esc(r.av)+'</div>' +
    '<h2>'+esc(r.name)+'</h2>' +
    '<div class="mt">'+esc(r.g)+' · '+esc(r.a)+' 岁 · '+esc(r.j)+'</div>' +
    '<div class="ds">'+esc(r.blurb)+
    (r.long?'\n\n⚠️ 这个角色的剧本篇幅明显比其他人长，读得快的人来演比较合适。':'')+'</div>' +
    '<input id="pname" type="text" placeholder="写上你的名字（可选）" ' +
    'style="width:100%;padding:13px;background:rgba(255,255,255,.06);' +
    'border:1px solid rgba(212,175,55,.25);border-radius:9px;color:#e8e2d0;' +
    'font-size:15px;font-family:inherit;margin-bottom:14px;text-align:center">' +
    '<button class="yes" onclick="confirmPick()">就演这个</button>' +
    '<button class="no" onclick="closeOv()">再看看</button></div>';
  document.body.appendChild(ov);
  setTimeout(()=>{ const el = document.getElementById('pname'); if(el) el.focus(); }, 60);
}
function closeOv(){ const o = document.getElementById('ov'); if(o) o.remove(); sel = null; }
function confirmPick(){
  const r = D.roles[sel];
  const el = document.getElementById('pname');
  picked[r.name] = (el && el.value.trim()) || '（未署名）';
  save(); closeOv(); render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function cp(btn, url){
  navigator.clipboard.writeText(url).then(()=>{
    btn.textContent = '已复制'; btn.classList.add('ok');
    setTimeout(()=>{ btn.textContent = '复制链接'; btn.classList.remove('ok'); }, 1600);
  }).catch(()=> prompt('手动复制这个链接：', url));
}
function reset(){
  if(!confirm('清空所有人的选择，重新来一次？')) return;
  picked = {}; save(); render();
}
boot();
</script>
</body></html>
